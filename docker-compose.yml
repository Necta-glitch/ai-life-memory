services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-life-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_life_memory
      POSTGRES_USER: ai_life_memory
      POSTGRES_PASSWORD: Jose14768.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: